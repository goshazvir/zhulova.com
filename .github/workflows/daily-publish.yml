name: Daily article publish (redeploy)

on:
  schedule:
    # Every day at 08:00 UTC (10:00 CEST / France morning)
    - cron: '0 8 * * 1-5'  # Monday–Friday only (matches publishDate weekday schedule)
  workflow_dispatch: # Manual trigger button in GitHub UI

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel redeploy
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            && echo "✅ Redeploy triggered — new articles with publishDate <= today will appear"
